<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>y = 1/x^2</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.14.0/distrib/jsxgraph.css">
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.14.0/distrib/jsxgraphcore.js"></script>
  <style>
    html, body { margin: 0; height: 100%; background: #fff; }
    /* iframe の大きさに合わせて正方形で表示する */
    #jxgbox { width: min(100vw, 100vh); height: min(100vw, 100vh); margin: 0 auto; }
  </style>
</head>
<body>
  <div id="jxgbox" class="jxgbox"></div>
  <script>
    const board = JXG.JSXGraph.initBoard('jxgbox', {
      boundingbox: [-10, 10, 10, -10],
      axis: true,
      showNavigation: false,
      showCopyright: false
    });
    function hyperbola(t) {
      return 1 / (t ** 2);
    }
    board.create('functiongraph', [hyperbola, -10, 10]);
  </script>
</body>
</html>
