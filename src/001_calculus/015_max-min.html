<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>閉区間での最大値・最小値（y = (x-2)x(x+2)）</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.14.0/distrib/jsxgraph.css">
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.14.0/distrib/jsxgraphcore.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    /* iframe の大きさに合わせて正方形で表示する（枠線込みで収まるよう border-box） */
    #jxgbox { box-sizing: border-box; width: min(100vw, 100vh); height: min(100vw, 100vh); margin: 0 auto; }
  </style>
</head>
<body>
  <div id="jxgbox" class="jxgbox"></div>
  <script>
    // JSXGraph初期設定
    const boardMaxMin = JXG.JSXGraph.initBoard("jxgbox", {
      axis: true, // 軸・グリッド線を表示するかの設定（デフォルトfalse）
      boundingbox: [-4, 4, 4, -4], // 領域の座標[左、上、右、下]
      keepaspectratio: true, // 表示するdivボックスの縦横比に合わせる？（デフォルトfalse)
      showNavigation: false, // ナビゲーションボタンを表示するかの設定（デフォルトfalse）
      showCopyright: false, // コピーライト文字列を表示するかの設定（デフォルトfalse）
    });
    // 関数 (x-2)x(x+2)
    function fx(t) {
      return t ** 3 - 4 * t;
    }
    // 指定区間内で関数の最大値をとるxを返す
    function getMaxX(start, end) {
      var maxX;
      var y = -1000000;
      for (let x = start; x <= end; x += 0.01) {
        if (y <= fx(x)) {
          y = fx(x);
          maxX = x;
        }
      }
      return maxX;
    }
    // 指定区間内で関数の最小値をとるxを返す
    function getMinX(start, end) {
      var minX;
      var y = 1000000;
      for (let x = start; x <= end; x += 0.01) {
        if (y >= fx(x)) {
          y = fx(x);
          minX = x;
        }
      }
      return minX;
    }
    // 関数をプロット
    let graph = boardMaxMin.create("functiongraph", [fx, -10, 10], {
      highlight: false, //ホバー時に色を変えて表示させるか
      strokeColor: "#0000ff", // 線の色
    });
    // スライダーをプロット
    var slider1 = boardMaxMin.create("slider", [
      [-3, 3.8],
      [0, 3.8],
      [-3, 0.1, 0],
    ]);
    var slider2 = boardMaxMin.create("slider", [
      [0, 3.8],
      [3, 3.8],
      [0, 0.1, 3],
    ]);
    // 直線をプロット
    var pa1 = boardMaxMin.create(
      "point",
      [
        function () {
          return slider1.Value();
        },
        3.2,
      ],
      {
        name: `a`, // 点の名前
        size: 0, // 点の大きさ
        face: "o", // 点の形、他にも種類あり、x+^v><'<>'など
        highlight: false, //ホバー時に色を変えて表示させるか
        trace: false, // 移動したときに跡を残すか？
        strokeColor: "#ffffff", // 色
      }
    );
    var pb1 = boardMaxMin.create(
      "point",
      [
        function () {
          return slider2.Value();
        },
        3.2,
      ],
      {
        name: `b`, // 点の名前
        size: 0, // 点の大きさ
        face: "o", // 点の形、他にも種類あり、x+^v><'<>'など
        highlight: false, //ホバー時に色を変えて表示させるか
        trace: false, // 移動したときに跡を残すか？
        strokeColor: "#ffffff", // 色
      }
    );
    var lia = boardMaxMin.create("line", [
      pa1,
      [
        function () {
          return pa1.X();
        },
        1,
      ],
    ]);
    var lib = boardMaxMin.create("line", [
      pb1,
      [
        function () {
          return pb1.X();
        },
        1,
      ],
    ]);
    // 指定区間内の最大値の点
    var pMax1 = boardMaxMin.create(
      "point",
      [
        function () {
          return getMaxX(slider1.Value(), slider2.Value());
        },
        0,
      ],
      {
        name: `c`, // 点の名前
        size: 2, // 点の大きさ
        face: "o", // 点の形、他にも種類あり、x+^v><'<>'など
        highlight: false, //ホバー時に色を変えて表示させるか
        trace: false, // 移動したときに跡を残すか？
        strokeColor: "#ff0000", // 色
      }
    );
    var pMax2 = boardMaxMin.create(
      "point",
      [
        function () {
          return pMax1.X();
        },
        function () {
          return fx(pMax1.X());
        },
      ],
      {
        name: `M`, // 点の名前
        size: 2, // 点の大きさ
        face: "o", // 点の形、他にも種類あり、x+^v><'<>'など
        highlight: false, //ホバー時に色を変えて表示させるか
        trace: false, // 移動したときに跡を残すか？
        strokeColor: "#ff0000", // 色
      }
    );
    var pMin1 = boardMaxMin.create(
      "point",
      [
        function () {
          return getMinX(slider1.Value(), slider2.Value());
        },
        0,
      ],
      {
        name: `c'`, // 点の名前
        size: 2, // 点の大きさ
        face: "o", // 点の形、他にも種類あり、x+^v><'<>'など
        highlight: false, //ホバー時に色を変えて表示させるか
        trace: false, // 移動したときに跡を残すか？
        strokeColor: "#ff0000", // 色
      }
    );
    var pMin2 = boardMaxMin.create(
      "point",
      [
        function () {
          return pMin1.X();
        },
        function () {
          return fx(pMin1.X());
        },
      ],
      {
        name: `m`, // 点の名前
        size: 2, // 点の大きさ
        face: "o", // 点の形、他にも種類あり、x+^v><'<>'など
        highlight: false, //ホバー時に色を変えて表示させるか
        trace: false, // 移動したときに跡を残すか？
        strokeColor: "#ff0000", // 色
      }
    );
    var liMax = boardMaxMin.create("line", [pMax1, pMax2], {
      strokeColor: "#ff0000", // 線の色
      strokeWidth: 4, // 線の太さ
      straightFirst: false, // 始点を突き抜けて直線にするか
      straightLast: false, // 終点を突き抜けて直線にするか
      dash: 2, // 点線？0:単線,1:点線,2:小さい点線,3:普通の点線?,4:長い点線
      highlight: false, //ホバー時に色を変えて表示させるか
    });
    var liMin = boardMaxMin.create("line", [pMin1, pMin2], {
      strokeColor: "#ff0000", // 線の色
      strokeWidth: 4, // 線の太さ
      straightFirst: false, // 始点を突き抜けて直線にするか
      straightLast: false, // 終点を突き抜けて直線にするか
      dash: 2, // 点線？0:単線,1:点線,2:小さい点線,3:普通の点線?,4:長い点線
      highlight: false, //ホバー時に色を変えて表示させるか
    });
    var poly = boardMaxMin.create(
      "polygon",
      [
        [
          function () {
            return slider1.Value();
          },
          10,
        ],
        [
          function () {
            return slider1.Value();
          },
          -10,
        ],
        [
          function () {
            return slider2.Value();
          },
          -10,
        ],
        [
          function () {
            return slider2.Value();
          },
          10,
        ],
      ],
      { fillOpacity: 0.05 }
    );
  </script>
</body>
</html>
