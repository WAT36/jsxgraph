<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>y = cos(x) と y = arccos(x)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.14.0/distrib/jsxgraph.css">
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.14.0/distrib/jsxgraphcore.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    /* iframe の大きさに合わせて正方形で表示する（枠線込みで収まるよう border-box） */
    #jxgbox { box-sizing: border-box; width: min(100vw, 100vh); height: min(100vw, 100vh); margin: 0 auto; }
  </style>
</head>
<body>
  <div id="jxgbox" class="jxgbox"></div>
  <script>
    const board = JXG.JSXGraph.initBoard('jxgbox', {
      boundingbox: [-4, 4, 4, -4],
      axis: true,
      showNavigation: false,
      showCopyright: false
    });
    // y = cos(x) 全体（点線）
    board.create('functiongraph', [Math.cos, -5, 5], {
      strokeColor: '#a9a9a9',
      dash: 1
    });
    // y = cos(x)（定義域 [0, π]）
    board.create('functiongraph', [Math.cos, 0, Math.PI], {
      strokeColor: '#000000'
    });
    // y = arccos(x)
    board.create('functiongraph', [Math.acos, -10, 10], {
      strokeColor: '#ff0000',
      strokeWidth: 2,
      highlight: true
    });
  </script>
</body>
</html>
