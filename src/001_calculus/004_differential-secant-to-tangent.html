<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>平均変化率から接線の傾きへ（y = x^2/10）</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/jsxgraph@1.14.0/distrib/jsxgraph.css">
  <script src="https://cdn.jsdelivr.net/npm/jsxgraph@1.14.0/distrib/jsxgraphcore.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #fff; }
    /* iframe の大きさに合わせて正方形で表示する（枠線込みで収まるよう border-box） */
    #jxgbox { box-sizing: border-box; width: min(100vw, 100vh); height: min(100vw, 100vh); margin: 0 auto; }
  </style>
</head>
<body>
  <div id="jxgbox" class="jxgbox"></div>
  <script>
    const board = JXG.JSXGraph.initBoard('jxgbox', {
      boundingbox: [-2, 10, 10, -2],
      axis: true,
      showNavigation: false,
      showCopyright: false
    });
    function parabola(t) {
      return (t ** 2) / 10;
    }
    board.create('functiongraph', [parabola, -2, 10], { name: 'y=f(x)' });
    const p1 = board.create('point', [3, parabola(3)], { name: '(a,f(a))' });
    const p2 = board.create('point', [7, parabola(7)], { name: '(b,f(b))' });
    board.create('line', [p1, p2], { strokeColor: 'red' });

    // 点 b を a に近づけるアニメーションを繰り返す
    let i = 0;
    setInterval(() => {
      p2.moveTo([7.0 - (0.1 * i), parabola(7.0 - (0.1 * i))], 100);
      i > 39 ? i = 0 : i++;
    }, 100);
  </script>
</body>
</html>
